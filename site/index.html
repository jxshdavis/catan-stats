<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catan Night</title>
  <meta name="description" content="Leaderboard, ratings and head-to-head records for our Catan group.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpolygon points='16,1 29,8.5 29,23.5 16,31 3,23.5 3,8.5' fill='%23e3b23c'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply a saved theme before first paint so the page never flashes the wrong one.
    try { var t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-head">
    <svg class="coast" id="coast" aria-hidden="true" focusable="false"></svg>
    <div class="wrap head-inner">
      <a class="brand" href="#/">
        <span class="brand-title" id="site-title">Catan Night</span>
        <span class="brand-sub" id="site-sub"></span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="#/" data-nav="leaderboard">Leaderboard</a>
        <a href="#/h2h" data-nav="h2h">Head to head</a>
        <a href="#/games" data-nav="games">Games</a>
        <a href="#/about" data-nav="about">How it works</a>
        <button class="theme-btn" id="theme-btn" type="button" aria-label="Switch color theme">
          <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 3a7 7 0 0 1 0 14z" fill="currentColor"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <main id="main" class="wrap" tabindex="-1">
    <p class="loading">Loading stats…</p>
  </main>

  <footer class="site-foot wrap">
    <p>Game data from <a href="https://twosheep.io">TwoSheep.io</a>, the free online Catan platform by Odd Stone Studios, used with their permission. This is a fan site for one group of friends.</p>
    <p id="built-at"></p>
  </footer>

  <div class="tip" id="tip" role="status" aria-live="polite" hidden></div>
  <script src="data/stats.js"></script>
  <script src="charts.js"></script>
  <script src="app.js"></script>
</body>
</html>
